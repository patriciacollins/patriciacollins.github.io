<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trish Collins</title>
  <meta name="description" content="Trish Collins is a software engineer working in New York City.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1224;
      --fg: #e8ecf4;
      --muted: #8b97ad;
      --line: #1e2a44;
      --accent: #7fb2ff;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(60rem 40rem at 85% -10%, rgba(80, 120, 255, .16), transparent 60%),
        radial-gradient(40rem 30rem at -10% 110%, rgba(40, 180, 200, .08), transparent 60%),
        var(--bg);
      color: var(--fg);
      font: 15px/1.7 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 4rem;
    }
    h1 {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 1.5rem;
    }
    p {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    ul {
      list-style: none;
      display: flex;
      gap: 1.25rem;
      margin: 0;
      padding: 1.5rem 0 0;
      border-top: 1px solid var(--line);
    }
    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: border-color .15s;
    }
    a:hover { color: var(--accent); border-color: var(--accent); }
    ::selection { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <h1>Trish Collins</h1>
    <p>Trish Collins is a software engineer working in New York City.</p>
    <ul>
      <li><a href="https://github.com/patriciacollins">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/trish-collins/">LinkedIn</a></li>
    </ul>
  </main>
</body>
</html>
