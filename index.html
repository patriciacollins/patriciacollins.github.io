<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trish Collins</title>
  <meta name="description" content="Trish Collins is a software engineer working in New York City.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --user: #0969da;
      --path: #0550ae;
      --link: #0550ae;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e; --fg: #e6edf3; --muted: #9198a1;
        --user: #a5d6ff; --path: #79c0ff; --link: #79c0ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/2.1 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    main {
      padding: 2.5rem 2rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    h1 { all: unset; }
    .user { color: var(--user); }
    .path { color: var(--path); }
    .sym { color: var(--muted); }
    .cmd { font-weight: 700; }
    .gap { display: block; height: 1.25em; }
    a { color: var(--link); text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    .cursor {
      display: inline-block;
      width: .6em;
      height: 1.15em;
      vertical-align: text-bottom;
      background: var(--fg);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
<main><span class="user">trish@nyc</span> <span class="path">~</span> <span class="sym">%</span> <span class="cmd">whoami</span>
<h1>Trish Collins</h1>
<span class="gap"></span><span class="user">trish@nyc</span> <span class="path">~</span> <span class="sym">%</span> <span class="cmd">cat about.txt</span>
Trish Collins is a software engineer working in New York City.
<span class="gap"></span><span class="user">trish@nyc</span> <span class="path">~</span> <span class="sym">%</span> <span class="cmd">ls links</span>
<a href="https://github.com/patriciacollins">github</a>    <a href="https://www.linkedin.com/in/trish-collins/">linkedin</a>
<span class="gap"></span><span class="user">trish@nyc</span> <span class="path">~</span> <span class="sym">%</span> <span class="cursor" aria-hidden="true"></span></main>
</body>
</html>
