<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trish Collins</title>
  <meta name="description" content="Trish Collins is a software engineer working in New York City.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #000000;
      --muted: #6e6e6e;
      --link: #0033b3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1e1e; --fg: #f2f2f2; --muted: #8e8e8e; --link: #6cb6ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    main {
      padding: 1.25rem 1.5rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    h1 { all: unset; }
    .prompt { color: var(--muted); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cursor {
      display: inline-block;
      width: .6em;
      height: 1.15em;
      vertical-align: text-bottom;
      background: var(--fg);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
<main><span class="prompt">trish@nyc ~ %</span> whoami
<h1>Trish Collins</h1>
<span class="prompt">trish@nyc ~ %</span> cat about.txt
Trish Collins is a software engineer working in New York City.
<span class="prompt">trish@nyc ~ %</span> ls links
<a href="https://github.com/patriciacollins">github</a>    <a href="https://www.linkedin.com/in/trish-collins/">linkedin</a>
<span class="prompt">trish@nyc ~ %</span> <span class="cursor" aria-hidden="true"></span></main>
</body>
</html>
